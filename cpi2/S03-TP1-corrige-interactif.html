<script>
/* ------------------------------------------------------------------ *
 *  Coloration syntaxique Python — segmentation puis échappement.
 *  On tokenise la chaîne brute, puis on échappe chaque segment : faire
 *  l'inverse ferait correspondre les motifs à l'intérieur des entités.
 * ------------------------------------------------------------------ */
const MOTS = new Set(("False None True and as assert async await break class " +
  "continue def del elif else except finally for from global if import in is " +
  "lambda nonlocal not or pass raise return try while with yield").split(" "));
const NATIFS = new Set(("abs all any bool dict enumerate filter float frozenset " +
  "hash int isinstance len list map max min print range repr reversed round set " +
  "sorted str sum tuple type zip").split(" "));
const JETON = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)/g;

function echapper(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function colorer(source) {
  let sortie = "", position = 0, m;
  JETON.lastIndex = 0;
  while ((m = JETON.exec(source)) !== null) {
    sortie += echapper(source.slice(position, m.index));
    const [tout, note, texte, nombre, mot] = m;
    if (note !== undefined)        sortie += '<span class="c">' + echapper(tout) + "</span>";
    else if (texte !== undefined)  sortie += '<span class="s">' + echapper(tout) + "</span>";
    else if (nombre !== undefined) sortie += '<span class="d">' + echapper(tout) + "</span>";
    else if (MOTS.has(mot))        sortie += '<span class="k">' + echapper(tout) + "</span>";
    else if (NATIFS.has(mot))      sortie += '<span class="n">' + echapper(tout) + "</span>";
    else                           sortie += echapper(tout);
    position = m.index + tout.length;
  }
  return sortie + echapper(source.slice(position));
}

/* Texte enrichi minimal : `code` et **gras**, échappés. */
function enrichir(t) {
  return echapper(t)
    .replace(/`([^`]+)`/g, '<code class="ligne">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

const bloc = (src, sortie) =>
  '<pre class="code' + (sortie ? " sortie" : "") + '">' +
  (sortie ? echapper(src) : colorer(src)) + "</pre>";

/* ------------------------------------------------------------------ *
 *  Le TP, tel qu'il a été distribué.
 * ------------------------------------------------------------------ */
const TP = [
{ partie: "Partie A — Prise en main", exercices: [

  { id: "a1", titre: "A1 — Liste et tuple",
    enonce: "On écrit :",
    code: `L = [2, 7, -1, 6, 4]
T = (2, 7, -1, 6, 4)`,
    questions: [
      { ref: "1.", texte: "Prédisez ce que rend L[-2], puis T[-2].",
        reponse: "Les deux rendent `6`.",
        sortie: `>>> L[-2]
6
>>> T[-2]
6`,
        notes: ["L'indice négatif compte depuis la fin : `-1` est le dernier élément, `-2` l'avant-dernier. **L'accès s'écrit de la même manière sur une liste et sur un tuple** : la différence entre les deux ne porte pas sur la lecture."],
        erreurs: [
          { titre: "Répondre `4` pour `L[-2]`",
            cause: "On compte `-2` comme s'il désignait le deuxième depuis la fin en partant de zéro. La numérotation négative commence à `-1`, non à `0` : il n'existe pas de `-0`." },
          { titre: "Attendre une erreur sur `T[-2]`",
            cause: "Un tuple n'interdit pas la lecture, seulement l'écriture. On confond immutabilité et inaccessibilité." }
        ] },

      { ref: "2.", texte: "Prédisez ce que rend T[1:4:2].",
        reponse: "Un tuple de deux éléments, `(7, 6)`.",
        sortie: `>>> T[1:4:2]
(7, 6)`,
        notes: ["La tranche se lit `[début:fin:pas]` : on part de l'indice 1, on s'arrête **avant** l'indice 4, en avançant de 2 en 2 — donc les indices 1 et 3, soit `7` et `6`.",
                "NB: trancher un tuple rend un tuple ; trancher une liste rend une liste. L'opération conserve le type."],
        solutions: [
          { verdict: "retenue", nom: "Dérouler les indices retenus",
            texte: "Indices parcourus : 1, puis 1+2 = 3 ; 3+2 = 5 dépasse la borne 4, on s'arrête. Valeurs : `T[1]` = 7 et `T[3]` = 6." },
          { verdict: "expert", nom: "Vérifier avec range",
            code: `print(list(range(1, 4, 2)))    # Affiche [1, 3]`,
            texte: "La tranche et `range` suivent la même règle de bornes. Quand la tranche est douteuse, `range` la rend lisible." }
        ],
        erreurs: [
          { titre: "Répondre `(7, -1, 6)`",
            cause: "C'est `T[1:4]`, sans le pas. Le troisième nombre n'est pas une borne mais un incrément." },
          { titre: "Inclure l'indice 4 et répondre `(7, 6, 4)`",
            cause: "La borne de fin est toujours exclue, avec ou sans pas." }
        ] },

      { ref: "3.", texte: "Prédisez ce qui se passe à l'exécution de L[3] = \"Hi\", puis de T[3] = \"Hi\".",
        reponse: "La première ligne modifie la liste en silence ; la seconde lève une `TypeError`.",
        sortie: `>>> L[3] = "Hi"
>>> L
[2, 7, -1, 'Hi', 4]
>>> T[3] = "Hi"
Traceback (most recent call last):
  File "<stdin>", line 1, in <module>
TypeError: 'tuple' object does not support item assignment`,
        notes: ["C'est **la** différence entre les deux structures, et elle ne se voit qu'à l'écriture. La liste accepte l'affectation par indice, le tuple la refuse.",
                "On remarquera que la liste accepte une chaîne de caractères au milieu d'entiers : Python ne contraint pas le type des éléments. Ce n'est pas la mutabilité qui est en cause ici, mais l'absence de typage des conteneurs natifs."],
        erreurs: [
          { titre: "Annoncer une `AttributeError` sur le tuple",
            cause: "L'affectation par indice ne passe pas par un attribut visible : elle est refusée par le protocole d'écriture lui-même, d'où une `TypeError`. L'`AttributeError`, c'est ce que rend `T.append(5)`." },
          { titre: "Croire que `L[3] = \"Hi\"` crée une nouvelle liste",
            cause: "Non : l'objet est modifié **sur place**. Tout autre nom désignant la même liste voit la modification. C'est exactement ce que le piège C3 exploitera." }
        ] },

      { ref: "4.", texte: "Que rend len(T) ? Et T+(39.1,) ?",
        reponse: "`len(T)` rend `5` ; `T+(39.1,)` rend un **nouveau** tuple de six éléments.",
        sortie: `>>> len(T)
5
>>> T + (39.1,)
(2, 7, -1, 6, 4, 39.1)
>>> T
(2, 7, -1, 6, 4)`,
        notes: ["La dernière ligne est la plus instructive : `T` n'a pas changé. La concaténation **construit** un tuple et le rend ; elle ne touche pas aux opérandes. Pour conserver le résultat, il faut l'affecter : `T = T + (39.1,)`."],
        solutions: [
          { verdict: "retenue", nom: "Concaténer puis réaffecter",
            code: `T = T + (39.1,)
print(len(T))        # Affiche 6`,
            texte: "Le nom `T` désigne désormais le nouveau tuple. L'ancien, que plus personne ne nomme, est oublié." },
          { verdict: "ok", nom: "Écrire T += (39.1,)",
            code: `T += (39.1,)         # équivaut à T = T + (39.1,)`,
            texte: "Sur un tuple, `+=` n'ajoute rien sur place : il concatène puis réaffecte le nom. Le raccourci est correct, mais il masque ce qui se passe." }
        ],
        erreurs: [
          { titre: "Écrire `T + (39.1)` sans la virgule",
            cause: "`(39.1)` n'est pas un tuple : les parenthèses y jouent leur rôle arithmétique habituel, et l'expression vaut le flottant `39.1`. D'où l'erreur ci-dessous. **C'est la virgule, et non la parenthèse, qui fait le tuple.**",
            sortie: `TypeError: can only concatenate tuple (not "float") to tuple` },
          { titre: "Attendre que `T` contienne six éléments après l'expression",
            cause: "Évaluer une expression n'est pas affecter. Sans `T =` devant, le tuple produit est calculé, affiché, puis perdu." }
        ] }
    ] },

  { id: "a2", titre: "A2 — Ensemble de chaînes",
    enonce: "On écrit :",
    code: `banks = {"Banque populaire", "CIH", "Saham Bank", "CIH", "BMCE"}`,
    questions: [
      { ref: "1.", texte: "Combien d'éléments contient banks ? Prédisez ce qu'affiche print(banks).",
        reponse: "Quatre éléments : le doublon `\"CIH\"` a été absorbé à la construction.",
        sortie: `>>> len(banks)
4
>>> print(banks)
{'CIH', 'Saham Bank', 'BMCE', 'Banque populaire'}`,
        notes: ["L'ensemble écarte les doublons **sans rien signaler** : aucune erreur, aucun avertissement. Cinq littéraux écrits, quatre éléments stockés.",
                "L'ordre affiché ci-dessus est celui qu'a donné *une* exécution. Il n'est pas reproductible d'un interpréteur à l'autre — c'est l'objet du piège C4. Ne tenez pour juste que l'**ensemble** des quatre noms, pas leur disposition."],
        erreurs: [
          { titre: "Répondre cinq",
            cause: "On compte les littéraux écrits plutôt que les éléments retenus. C'est précisément la propriété que l'on vient chercher dans un ensemble : la déduplication est gratuite et silencieuse." },
          { titre: "Prédire l'ordre d'écriture",
            cause: "Un ensemble n'a pas d'ordre d'insertion à restituer. Prédire l'affichage exact est une question mal posée, et le TP la pose exprès." }
        ] },

      { ref: "2.", texte: "Que rend \" CIH \" in banks ? Et banks[0] ?",
        reponse: "Le test rend `False` ; l'indexation lève une `TypeError`.",
        sortie: `>>> " CIH " in banks

    </div>`).join("");
  rail.querySelectorAll(".onglet").forEach(b =>
    b.addEventListener("click", () => afficher(b.dataset.cible, true)));
}

function fiche(item, estErreur) {
  const classeVerdict = { retenue: "v-retenue", ok: "v-ok",
                          eviter: "v-eviter", expert: "v-expert" }[item.verdict];
  const libelle = { retenue: "à retenir", ok: "acceptable",
                    eviter: "à éviter", expert: "pour aller plus loin" }[item.verdict];
  return `
    <article class="fiche${estErreur ? " erreur" : ""}">
      <div class="fiche-tete">
        <h4>${enrichir(item.nom || item.titre)}</h4>
        ${estErreur
          ? '<span class="verdict v-eviter">erreur fréquente</span>'
          : (classeVerdict ? `<span class="verdict ${classeVerdict}">${libelle}</span>` : "")}
      </div>
      <div class="fiche-corps">
        ${item.code ? bloc(item.code, false) : ""}
        ${item.sortie ? bloc(item.sortie, true) : ""}
        ${item.texte ? `<p>${enrichir(item.texte)}</p>` : ""}
        ${item.cause ? `<dl class="ligne-diag"><dt>Pourquoi</dt><dd>${enrichir(item.cause)}</dd></dl>` : ""}
      </div>
    </article>`;
}

function tableau(p) {
  return `<div class="table-enveloppe"><table class="pile">
    <thead><tr>${p.entetes.map(h => `<th>${enrichir(h)}</th>`).join("")}</tr></thead>
    <tbody>${p.lignes.map(l => `<tr>${l.map(c => `<td>${enrichir(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function corpsCorrection(q) {
  return `
    <div class="reponse">
      <span class="etiquette">Réponse</span>
      <p>${enrichir(q.reponse)}</p>
    </div>
    ${q.sortie ? bloc(q.sortie, true) : ""}
    ${q.pile ? tableau(q.pile) : ""}
    ${(q.notes || []).map(n => `<p>${enrichir(n)}</p>`).join("")}
    ${q.solutions && q.solutions.length ? `
      <div class="sous-titre">Propositions de solution</div>
      <div class="lot">${q.solutions.map(s => fiche(s, false)).join("")}</div>` : ""}
    ${q.erreurs && q.erreurs.length ? `
      <div class="sous-titre">Erreurs fréquentes</div>
      <div class="lot">${q.erreurs.map(e => fiche(e, true)).join("")}</div>` : ""}`;
}

let courant = null;

function afficher(id, deplacerFocus) {
  const ex = tousExercices.find(e => e.id === id) || tousExercices[0];
  courant = ex;
  rail.querySelectorAll(".onglet").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.cible === ex.id)));

  travail.innerHTML = `
    <div class="chapeau">
      <div>
        <span class="partie">${echapper(ex.partie)}</span>
        <h2>${echapper(ex.titre)}</h2>
      </div>
      <button class="bouton-plat" type="button" id="tout">Tout afficher</button>
    </div>
    <div class="enonce">
      <p>${enrichir(ex.enonce)}</p>
      ${ex.code ? bloc(ex.code, false) : ""}
    </div>
    ${ex.questions.map((q, i) => {
      const cle = cleQuestion(ex, i);
      const ouvert = vus.has(cle);
      return `
      <article class="question" id="q-${cle}">
        <div class="question-tete">
          ${q.ref ? `<span class="ref">${echapper(q.ref)}</span>` : ""}
          <div class="texte">${enrichir(q.texte)}</div>
          <button class="devoiler" type="button" data-cle="${cle}"
                  aria-expanded="${ouvert}" aria-controls="c-${cle}">
            ${ouvert ? "Masquer" : "Afficher la correction"}
          </button>
        </div>
        <div class="correction" id="c-${cle}" ${ouvert ? "" : "hidden"}>
          ${corpsCorrection(q)}
        </div>
      </article>`;
    }).join("")}`;

  travail.querySelectorAll(".devoiler").forEach(b =>
    b.addEventListener("click", () => basculer(b)));
  document.getElementById("tout").addEventListener("click", toutAfficher);
  majPastilles();
  if (deplacerFocus) {
    history.replaceState(null, "", "#" + ex.id);
    travail.querySelector("h2").scrollIntoView({ block: "nearest" });
  }
}

function basculer(bouton) {
  const cle = bouton.dataset.cle;
  const zone = document.getElementById("c-" + cle);
  const ouvrir = zone.hidden;
  zone.hidden = !ouvrir;
  bouton.setAttribute("aria-expanded", String(ouvrir));
  bouton.textContent = ouvrir ? "Masquer" : "Afficher la correction";
  if (ouvrir) vus.add(cle); else vus.delete(cle);
  memoriser();
  majPastilles();
}

function toutAfficher() {
  const boutons = [...travail.querySelectorAll(".devoiler")];
  const toutOuvert = boutons.every(b => b.getAttribute("aria-expanded") === "true");
  boutons.forEach(b => {
    if ((b.getAttribute("aria-expanded") === "true") === toutOuvert) basculer(b);
  });
  document.getElementById("tout").textContent = toutOuvert ? "Tout afficher" : "Tout masquer";
}

function majPastilles() {
  rail.querySelectorAll(".onglet").forEach(b => {
    const ex = tousExercices.find(e => e.id === b.dataset.cible);
    b.classList.toggle("vu", exerciceVu(ex));
  });
  const bouton = document.getElementById("tout");
  if (bouton && courant) {
    const boutons = [...travail.querySelectorAll(".devoiler")];
    bouton.textContent = boutons.every(b => b.getAttribute("aria-expanded") === "true")
      ? "Tout masquer" : "Tout afficher";
  }
}

construireRail();
const ancre = (location.hash || "").replace("#", "");
afficher(tousExercices.some(e => e.id === ancre) ? ancre : tousExercices[0].id, false);
</script>
