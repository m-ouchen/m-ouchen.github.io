<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Corrigé du TD 1 : Fonctions et récursivité</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
/* Disposition : console à deux volets — rail des exercices à gauche, colonne de
   travail à droite ; au format téléphone le rail devient une barre de pastilles. */
:root {
  --bleu:        #2A5B7F;   /* charte M235 — titres, rail, filets        */
  --sarcelle:    #2E8B79;   /* charte M235 assombrie pour le texte       */
  --vert:        #5E7A18;   /* charte M235 assombrie — solution retenue  */
  --prune:       #B03F60;   /* erreurs fréquentes                        */
  --encre:       #16242E;
  --encre-douce: #51616C;
  --fond:        #FBFCFD;
  --carte:       #FFFFFF;
  --surface:     #F1F6F9;   /* neutre biaisé vers le bleu de la charte   */
  --filet:       #D6E3EC;
  --code-fond:   #F4F8FA;
  --code-filet:  #DCE8F0;
  --ombre:       0 1px 2px rgba(22, 36, 46, .06), 0 8px 24px rgba(22, 36, 46, .05);

  --syn-mot:     #C0392B;
  --syn-natif:   #6F42C1;
  --syn-texte:   #0B4F8A;
  --syn-note:    #67757F;
  --syn-nombre:  #1A6FAF;

  --titre: "Zilla Slab", Rockwell, Georgia, serif;
  --corps: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "JetBrains Mono", ui-monospace, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bleu: #7FB8DC; --sarcelle: #5BC9B2; --vert: #A8CE4F; --prune: #E8849E;
    --encre: #E6EDF2; --encre-douce: #9FB0BC;
    --fond: #0E1A22; --carte: #15242E; --surface: #1A2C38; --filet: #2A4050;
    --code-fond: #101E27; --code-filet: #263B49;
    --ombre: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --syn-mot: #FF8A7A; --syn-natif: #C5A3F5; --syn-texte: #8FD0FF;
    --syn-note: #7A8B96; --syn-nombre: #7FC4F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bleu: #7FB8DC; --sarcelle: #5BC9B2; --vert: #A8CE4F; --prune: #E8849E;
  --encre: #E6EDF2; --encre-douce: #9FB0BC;
  --fond: #0E1A22; --carte: #15242E; --surface: #1A2C38; --filet: #2A4050;
  --code-fond: #101E27; --code-filet: #263B49;
  --ombre: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --syn-mot: #FF8A7A; --syn-natif: #C5A3F5; --syn-texte: #8FD0FF;
  --syn-note: #7A8B96; --syn-nombre: #7FC4F5;
  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] {
  display: none !important;
}

body {
  margin: 0; background: var(--fond); color: var(--encre);
  font-family: var(--corps); font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { font-family: var(--titre); text-wrap: balance; margin: 0; }
code, pre { font-family: var(--mono); }
:focus-visible { outline: 2.5px solid var(--sarcelle); outline-offset: 2px; border-radius: 3px; }

/* — bandeau — */
.bandeau {
  background: var(--bleu); color: #fff;
  padding-block: 18px 16px; padding-inline: 16px;
}
.bandeau-interieur { max-width: 1180px; margin: 0 auto; display: flex;
  flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
.bandeau h1 { font-size: clamp(1.25rem, 1rem + 1.2vw, 1.7rem); font-weight: 600;
  letter-spacing: .01em; }
.bandeau p { margin: 0; font-size: .86rem; opacity: .82; }
.bandeau .module { font-family: var(--mono); font-size: .76rem;
  letter-spacing: .08em; text-transform: uppercase; opacity: .7; }

/* — mise en page — */
.page { max-width: 1180px; margin: 0 auto; padding-inline: 16px;
  padding-block: 20px 56px; display: grid; gap: 24px;
  grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); } }

/* — rail — */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .rail { position: static; } }
.rail-groupe + .rail-groupe { margin-top: 18px; }
.rail-titre { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--encre-douce); margin-bottom: 7px; }
.rail-liste { display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 860px) {
  .rail-liste { flex-direction: row; flex-wrap: wrap; }
  .rail-groupe + .rail-groupe { margin-top: 10px; }
}
.onglet {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: .91rem; text-align: left; cursor: pointer;
  background: none; border: 1px solid transparent; border-radius: 7px;
  padding: 6px 10px; color: var(--encre);
}
.onglet:hover { background: var(--surface); }
.onglet[aria-current="true"] { background: var(--bleu); color: #fff;
  border-color: var(--bleu); }
.onglet .cle { font-family: var(--mono); font-size: .78rem; font-weight: 600;
  min-width: 1.6em; }
.onglet .pastille { margin-left: auto; width: 7px; height: 7px; border-radius: 50%;
  background: var(--vert); opacity: 0; flex: none; }
.onglet.vu .pastille { opacity: 1; }
@media (max-width: 860px) { .onglet { width: auto; } .onglet .pastille { margin-left: 4px; } }

/* — colonne de travail — */
.travail { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.chapeau { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline;
  justify-content: space-between; }
.chapeau h2 { font-size: clamp(1.15rem, 1rem + .9vw, 1.5rem); color: var(--bleu);
  font-weight: 600; }
.chapeau .partie { font-family: var(--mono); font-size: .72rem; letter-spacing: .09em;
  text-transform: uppercase; color: var(--encre-douce); display: block;
  margin-bottom: 2px; }

.bouton-plat { font: inherit; font-size: .84rem; cursor: pointer;
  background: var(--carte); color: var(--bleu); border: 1px solid var(--filet);
  border-radius: 7px; padding: 5px 12px; }
.bouton-plat:hover { background: var(--surface); }

.enonce { background: var(--surface); border: 1px solid var(--filet);
  border-radius: 10px; padding: 14px 16px; }
.enonce p { margin: 0 0 10px; }
.enonce p:last-child { margin-bottom: 0; }

.question { background: var(--carte); border: 1px solid var(--filet);
  border-radius: 10px; box-shadow: var(--ombre); overflow: hidden; }
.question-tete { display: flex; gap: 12px; align-items: flex-start;
  padding: 13px 16px; }
.question-tete .ref { font-family: var(--mono); font-weight: 600;
  color: var(--sarcelle); flex: none; padding-top: 1px; }
.question-tete .texte { min-width: 0; flex: 1; }
.devoiler { font: inherit; font-size: .84rem; cursor: pointer; flex: none;
  background: var(--bleu); color: #fff; border: 1px solid var(--bleu);
  border-radius: 7px; padding: 5px 12px; white-space: nowrap; }
.devoiler[aria-expanded="true"] { background: var(--carte); color: var(--bleu); }
@media (max-width: 560px) {
  .question-tete { flex-wrap: wrap; }
  .devoiler { width: 100%; }
}
.correction { border-top: 1px solid var(--filet); padding: 14px 16px 16px;
  display: flex; flex-direction: column; gap: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .correction { animation: apparait .22s ease-out; }
  @keyframes apparait { from { opacity: 0; transform: translateY(-3px); } }
}

.reponse { border-left: 3px solid var(--vert); padding-left: 13px; }
.reponse .etiquette { font-family: var(--mono); font-size: .68rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--vert);
  font-weight: 600; display: block; margin-bottom: 4px; }
.reponse p { margin: 0 0 8px; }
.reponse p:last-child { margin-bottom: 0; }

.sous-titre { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--encre-douce); font-weight: 600;
  display: flex; align-items: center; gap: 9px; }
.sous-titre::after { content: ""; flex: 1; height: 1px; background: var(--filet); }

.lot { display: flex; flex-direction: column; gap: 10px; }
.fiche { border: 1px solid var(--filet); border-radius: 9px; overflow: hidden;
  background: var(--carte); }
.fiche-tete { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding: 9px 13px; background: var(--surface);
  border-bottom: 1px solid var(--filet); }
.fiche-tete h4 { font-size: .95rem; font-weight: 600; min-width: 0; }
.verdict { font-family: var(--mono); font-size: .66rem; letter-spacing: .07em;
  text-transform: uppercase; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; border: 1px solid currentColor; flex: none; }
.v-retenue  { color: var(--vert); }
.v-ok       { color: var(--sarcelle); }
.v-eviter   { color: var(--prune); }
.v-expert   { color: var(--bleu); }
.fiche-corps { padding: 11px 13px; display: flex; flex-direction: column; gap: 9px; }
.fiche-corps p { margin: 0; }
.fiche.erreur { border-color: color-mix(in srgb, var(--prune) 38%, var(--filet)); }
.fiche.erreur .fiche-tete { background: color-mix(in srgb, var(--prune) 8%, var(--carte)); }

.ligne-diag { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px;
  font-size: .91rem; }
.ligne-diag dt { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--encre-douce); padding-top: 3px; }
.ligne-diag dd { margin: 0; min-width: 0; }

pre.code { margin: 0; background: var(--code-fond); border: 1px solid var(--code-filet);
  border-radius: 7px; padding: 10px 12px; overflow-x: auto;
  font-size: .845rem; line-height: 1.55; tab-size: 4; }
pre.code.sortie { background: var(--surface); color: var(--encre-douce); }
.k { color: var(--syn-mot); } .n { color: var(--syn-natif); }
.s { color: var(--syn-texte); } .c { color: var(--syn-note); font-style: italic; }
.d { color: var(--syn-nombre); }
code.ligne { background: var(--surface); border: 1px solid var(--filet);
  border-radius: 4px; padding: .5px 5px; font-size: .88em; }

table.pile { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.pile th, table.pile td { border: 1px solid var(--filet); padding: 6px 10px;
  text-align: left; }
table.pile th { background: var(--surface); font-family: var(--mono);
  font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
  color: var(--encre-douce); font-weight: 600; }
table.pile td:first-child, table.pile td:last-child { font-family: var(--mono);
  font-variant-numeric: tabular-nums; }
.table-enveloppe { overflow-x: auto; }

.pied { max-width: 1180px; margin: 0 auto; padding-inline: 16px;
  padding-block: 0 40px; color: var(--encre-douce); font-size: .82rem; }
.pied p { margin: 0; }
</style>
</head>
<body>

<header class="bandeau">
  <div class="bandeau-interieur">
    <div>
      <span class="module">Programmation avancée en Python</span>
      <h1>TD 1 — Fonctions et récursivité</h1>
    </div>
    <p>Choisissez un exercice, cherchez, puis dévoilez la correction.</p>
  </div>
</header>

<main class="page">
  <nav class="rail" id="rail" aria-label="Exercices du TD"></nav>
  <section class="travail" id="travail" aria-live="polite"></section>
</main>

<footer class="pied">
  <p>École Supérieure Mohammed VI d'Ingénieurs en Sciences de la Santé — UM6SS.
     Toutes les sorties affichées ici ont été exécutées sous Python&nbsp;3.11.</p>
</footer>

<script>
/* ------------------------------------------------------------------ *
 *  Coloration syntaxique Python — segmentation puis échappement.
 *  On tokenise la chaîne brute, puis on échappe chaque segment : faire
 *  l'inverse ferait correspondre les motifs à l'intérieur des entités.
 * ------------------------------------------------------------------ */
const MOTS = new Set(("False None True and as assert async await break class " +
  "continue def del elif else except finally for from global if import in is " +
  "lambda nonlocal not or pass raise return try while with yield").split(" "));
const NATIFS = new Set(("abs all any bool dict enumerate filter float frozenset " +
  "int isinstance len list map max min print range repr reversed round set " +
  "sorted str sum tuple type zip").split(" "));
const JETON = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')|(\b\d+\.?\d*\b)|([A-Za-z_]\w*)/g;

function echapper(t) {
  return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function colorer(source) {
  let sortie = "", position = 0, m;
  JETON.lastIndex = 0;
  while ((m = JETON.exec(source)) !== null) {
    sortie += echapper(source.slice(position, m.index));
    const [tout, note, texte, nombre, mot] = m;
    if (note !== undefined)        sortie += '<span class="c">' + echapper(tout) + "</span>";
    else if (texte !== undefined)  sortie += '<span class="s">' + echapper(tout) + "</span>";
    else if (nombre !== undefined) sortie += '<span class="d">' + echapper(tout) + "</span>";
    else if (MOTS.has(mot))        sortie += '<span class="k">' + echapper(tout) + "</span>";
    else if (NATIFS.has(mot))      sortie += '<span class="n">' + echapper(tout) + "</span>";
    else                           sortie += echapper(tout);
    position = m.index + tout.length;
  }
  return sortie + echapper(source.slice(position));
}

/* Texte enrichi minimal : `code` et **gras**, échappés. */
function enrichir(t) {
  return echapper(t)
    .replace(/`([^`]+)`/g, '<code class="ligne">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

const bloc = (src, sortie) =>
  '<pre class="code' + (sortie ? " sortie" : "") + '">' +
  (sortie ? echapper(src) : colorer(src)) + "</pre>";

/* ------------------------------------------------------------------ *
 *  Le TD, tel qu'il a été distribué.
 * ------------------------------------------------------------------ */
const TD = [
{ partie: "Partie A — Lire et tracer des fonctions", exercices: [

  { id: "a1", titre: "A1 — Afficher ou rendre",
    enonce: "On considère le programme suivant.",
    code: `def afficher_double(x):
    print(x * 2)

def calculer_double(x):
    return x * 2

r1 = afficher_double(10)
r2 = calculer_double(10)
print(r1, r2)`,
    questions: [
      { ref: "a)", texte: "Écrivez, ligne par ligne, tout ce qui s'affiche à l'exécution.",
        reponse: "Deux lignes s'affichent, dans cet ordre.",
        sortie: `20
None 20`,
        notes: ["Le premier `20` vient du `print` qui est **à l'intérieur** de `afficher_double`. La seconde ligne vient du `print` final, qui affiche les deux variables."],
        erreurs: [
          { titre: "N'annoncer qu'une seule ligne",
            cause: "On oublie que `afficher_double(10)` affiche déjà quelque chose au moment de l'appel, avant même que `r1` reçoive sa valeur." },
          { titre: "Écrire `20 20`",
            cause: "C'est la réponse attendue si l'on croit que `r1` contient ce que la fonction a affiché. Une fonction n'« attrape » pas ce qu'elle imprime." }
        ] },

      { ref: "b)", texte: "Quelle est la valeur de r1 ? Celle de r2 ? Justifiez en une phrase.",
        reponse: "`r1` vaut `None`, `r2` vaut `20`.",
        notes: ["`afficher_double` ne comporte aucun `return` : elle affiche, puis rend implicitement `None`. `calculer_double` rend la valeur `20`, que la fonction elle-même n'affiche pas."],
        solutions: [
          { verdict: "retenue", nom: "Réponse rédigée",
            texte: "`r1` vaut `None` car la fonction ne rend rien — `print` s'adresse à l'utilisateur, pas au programme appelant. `r2` vaut `20` car `return` transmet la valeur à l'appelant." },
          { verdict: "ok", nom: "Réponse minimale acceptée",
            texte: "`r1 = None`, `r2 = 20`, parce que seule la seconde fonction a un `return`." }
        ],
        erreurs: [
          { titre: "Répondre que `r1` vaut 20",
            cause: "C'est l'erreur la plus fréquente du TD, et celle que le quiz de la séance 1 avait déjà révélée. Elle ne provoque aucune erreur immédiate : le programme continue avec un `None` dans les mains." }
        ] },

      { ref: "c)", texte: "On ajoute la ligne print(r1 + 1) à la fin. Que se passe-t-il ?",
        reponse: "Le programme s'arrête sur une exception.",
        sortie: `TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'`,
        notes: ["Le point à retenir n'est pas le message, mais **où se trouve la faute**. Elle a été commise à la ligne `r1 = afficher_double(10)` ; elle ne se manifeste que trois lignes plus loin, sous une forme qui ne mentionne plus la fonction."],
        erreurs: [
          { titre: "Chercher l'erreur dans `print`",
            cause: "`print` n'y est pour rien : il reçoit déjà le résultat de l'addition, qui a échoué avant." },
          { titre: "Annoncer un `NameError`",
            cause: "`r1` existe bel et bien — elle contient `None`. Un `NameError` signalerait une variable jamais définie." }
        ] }
    ] },

  { id: "a2", titre: "A2 — Portée des variables",
    enonce: "On considère le programme suivant. Ce programme lève une erreur : laquelle, et pourquoi ?",
    code: `total = 0

def ajouter(valeur):
    total = total + valeur
    return total

print(ajouter(5))`,
    questions: [
      { ref: "", texte: "Nommez l'erreur, puis expliquez-la.",
        reponse: "Le programme lève une `UnboundLocalError`.",
        sortie: `UnboundLocalError: cannot access local variable 'total'
where it is not associated with a value`,
        notes: [
          "L'affectation `total = total + valeur` fait de `total` une variable **locale pour l'ensemble du corps** de la fonction, y compris à droite du signe `=`.",
          "Au moment d'évaluer `total + valeur`, la variable locale n'a encore reçu aucune valeur, et la variable globale est masquée."
        ],
        solutions: [
          { verdict: "retenue", nom: "Paramètre et valeur rendue",
            code: `def ajouter(total, valeur):
    return total + valeur

total = ajouter(total, 5)`,
            texte: "La fonction devient prévisible : son résultat ne dépend que de ses arguments, et elle se teste isolément." },
          { verdict: "ok", nom: "Déclarer la variable globale",
            code: `total = 0

def ajouter(valeur):
    global total
    total = total + valeur
    return total`,
            texte: "Correct, mais la fonction dépend désormais d'un état extérieur : deux appels identiques peuvent rendre des valeurs différentes selon l'ordre d'exécution." },
          { verdict: "eviter", nom: "Renommer la variable locale",
            code: `def ajouter(valeur):
    resultat = total + valeur
    return resultat`,
            texte: "L'erreur disparaît — plus aucune affectation ne rend `total` locale — mais la fonction lit toujours une variable globale qu'elle ne contrôle pas." }
        ],
        erreurs: [
          { titre: "Annoncer un `NameError`",
            cause: "Les deux erreurs se ressemblent, mais `UnboundLocalError` dit précisément que le nom est **local et pas encore affecté**. C'est cette nuance qui explique le phénomène." },
          { titre: "Croire que l'ordre des lignes est en cause",
            cause: "Déplacer `total = 0` ne change rien : Python décide qu'un nom est local en lisant le corps de la fonction, avant de l'exécuter." }
        ] }
    ] },

  { id: "a3", titre: "A3 — Valeur par défaut mutable",
    enonce: "On considère le programme suivant.",
    code: `def empiler(valeur, pile=[]):
    pile.append(valeur)
    return pile

print(empiler(1))
print(empiler(2))
print(empiler(3))`,
    questions: [
      { ref: "a)", texte: "Qu'affichent les trois print ?",
        reponse: "La pile grossit d'un appel à l'autre.",
        sortie: `[1]
[1, 2]
[1, 2, 3]`,
        notes: ["La valeur par défaut est évaluée **une seule fois, à la définition** de la fonction. La liste `[]` écrite dans l'en-tête est donc un objet unique, partagé par tous les appels qui ne fournissent pas le second argument."],
        erreurs: [
          { titre: "Répondre `[1]`, `[2]`, `[3]`",
            cause: "C'est la réponse attendue si l'on suppose que `pile=[]` reconstruit une liste vide à chaque appel. Elle est intuitive, et fausse." }
        ] },

      { ref: "b)", texte: "Corrigez la fonction pour que chaque appel sans second argument reparte d'une pile vide.",
        reponse: "On remplace la liste par un témoin `None`, et on crée la liste dans le corps.",
        solutions: [
          { verdict: "retenue", nom: "Témoin None",
            code: `def empiler(valeur, pile=None):
    if pile is None:
        pile = []
    pile.append(valeur)
    return pile`,
            texte: "La forme idiomatique. Chaque appel sans second argument crée sa propre liste ; un appel avec une pile existante la modifie, comme on s'y attend." },
          { verdict: "ok", nom: "Copier en entrée",
            code: `def empiler(valeur, pile=[]):
    pile = list(pile)
    pile.append(valeur)
    return pile`,
            texte: "Donne bien `[1]`, `[2]`, `[3]`. Mais le comportement change aussi pour l'appelant qui fournit sa propre pile : elle n'est plus modifiée, seule la copie l'est. À n'employer que si c'est voulu." }
        ],
        erreurs: [
          { titre: "Vider la liste au début",
            code: `def empiler(valeur, pile=[]):
    pile.clear()        # efface la pile de l'appelant !

          { verdict: "ok", nom: "Avec sum et une expression génératrice",
            code: `def somme_imbriquee(donnees):
    return sum(somme_imbriquee(e) if isinstance(e, list) else e
               for e in donnees)`,
            texte: "Même raisonnement, en une expression. Plus dense à lire, mais rigoureusement équivalent." }
        ],
        notes: ["C'est exactement la structure d'un parcours d'arbre : un nœud contient des feuilles et d'autres nœuds. Nous l'écrirons en séance 6."],
        erreurs: [
          { titre: "Oublier le test de type",
            code: `total = total + element        # sans isinstance`,
            sortie: `TypeError: unsupported operand type(s) for +=: 'int' and 'list'`,
            cause: "On essaie d'ajouter une sous-liste à un entier. Le message nomme les deux types en cause, ce qui aide à trouver la ligne." },
          { titre: "Rappeler la fonction sur un nombre",
            code: `return sum(somme_imbriquee(e) for e in donnees)`,
            sortie: `TypeError: 'int' object is not iterable`,
            cause: "Sans le test, la fonction est rappelée sur `1`, puis essaie de le parcourir. C'est le même oubli, vu de l'autre côté." }
        ] }
    ] }
] }
];

/* ------------------------------------------------------------------ *
 *  Mémoire locale — simple confort de lecture, jamais indispensable.
 * ------------------------------------------------------------------ */
const CLE = "m235-td1-corriges-vus";
let vus = new Set();
try {
  const brut = localStorage.getItem(CLE);
  if (brut) vus = new Set(JSON.parse(brut));
} catch (e) { /* navigation privée, stockage bloqué : on continue sans */ }

function memoriser() {
  try { localStorage.setItem(CLE, JSON.stringify([...vus])); } catch (e) {}
}

/* ------------------------------------------------------------------ *
 *  Rendu
 * ------------------------------------------------------------------ */
const rail = document.getElementById("rail");
const travail = document.getElementById("travail");
const tousExercices = TD.flatMap(p => p.exercices.map(e => ({ ...e, partie: p.partie })));

function cleQuestion(ex, i) { return ex.id + "-" + i; }

function exerciceVu(ex) {
  return ex.questions.every((_, i) => vus.has(cleQuestion(ex, i)));
}

function construireRail() {
  rail.innerHTML = TD.map(partie => `
    <div class="rail-groupe">
      <div class="rail-titre">${echapper(partie.partie.replace(/^Partie /, ""))}</div>
      <div class="rail-liste">
        ${partie.exercices.map(ex => `
          <button class="onglet" type="button" data-cible="${ex.id}">
            <span class="cle">${echapper(ex.titre.split(" — ")[0])}</span>
            <span>${echapper(ex.titre.split(" — ")[1] || "")}</span>
            <span class="pastille" aria-hidden="true"></span>
          </button>`).join("")}
      </div>
    </div>`).join("");
  rail.querySelectorAll(".onglet").forEach(b =>
    b.addEventListener("click", () => afficher(b.dataset.cible, true)));
}

function fiche(item, estErreur) {
  const classeVerdict = { retenue: "v-retenue", ok: "v-ok",
                          eviter: "v-eviter", expert: "v-expert" }[item.verdict];
  const libelle = { retenue: "à retenir", ok: "acceptable",
                    eviter: "à éviter", expert: "pour aller plus loin" }[item.verdict];
  return `
    <article class="fiche${estErreur ? " erreur" : ""}">
      <div class="fiche-tete">
        <h4>${enrichir(item.nom || item.titre)}</h4>
        ${estErreur
          ? '<span class="verdict v-eviter">erreur fréquente</span>'
          : (classeVerdict ? `<span class="verdict ${classeVerdict}">${libelle}</span>` : "")}
      </div>
      <div class="fiche-corps">
        ${item.code ? bloc(item.code, false) : ""}
        ${item.sortie ? bloc(item.sortie, true) : ""}
        ${item.texte ? `<p>${enrichir(item.texte)}</p>` : ""}
        ${item.cause ? `<dl class="ligne-diag"><dt>Pourquoi</dt><dd>${enrichir(item.cause)}</dd></dl>` : ""}
      </div>
    </article>`;
}

function tableau(p) {
  return `<div class="table-enveloppe"><table class="pile">
    <thead><tr>${p.entetes.map(h => `<th>${echapper(h)}</th>`).join("")}</tr></thead>
    <tbody>${p.lignes.map(l => `<tr>${l.map(c => `<td>${enrichir(c)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function corpsCorrection(q) {
  return `
    <div class="reponse">
      <span class="etiquette">Réponse</span>
      <p>${enrichir(q.reponse)}</p>
    </div>
    ${q.sortie ? bloc(q.sortie, true) : ""}
    ${q.pile ? tableau(q.pile) : ""}
    ${(q.notes || []).map(n => `<p>${enrichir(n)}</p>`).join("")}
    ${q.solutions && q.solutions.length ? `
      <div class="sous-titre">Propositions de solution</div>
      <div class="lot">${q.solutions.map(s => fiche(s, false)).join("")}</div>` : ""}
    ${q.erreurs && q.erreurs.length ? `
      <div class="sous-titre">Erreurs fréquentes</div>
      <div class="lot">${q.erreurs.map(e => fiche(e, true)).join("")}</div>` : ""}`;
}

let courant = null;

function afficher(id, deplacerFocus) {
  const ex = tousExercices.find(e => e.id === id) || tousExercices[0];
  courant = ex;
  rail.querySelectorAll(".onglet").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.cible === ex.id)));

  travail.innerHTML = `
    <div class="chapeau">
      <div>
        <span class="partie">${echapper(ex.partie)}</span>
        <h2>${echapper(ex.titre)}</h2>
      </div>
      <button class="bouton-plat" type="button" id="tout">Tout afficher</button>
    </div>
    <div class="enonce">
      <p>${enrichir(ex.enonce)}</p>
      ${ex.code ? bloc(ex.code, false) : ""}
    </div>
    ${ex.questions.map((q, i) => {
      const cle = cleQuestion(ex, i);
      const ouvert = vus.has(cle);
      return `
      <article class="question" id="q-${cle}">
        <div class="question-tete">
          ${q.ref ? `<span class="ref">${echapper(q.ref)}</span>` : ""}
          <div class="texte">${enrichir(q.texte)}</div>
          <button class="devoiler" type="button" data-cle="${cle}"
                  aria-expanded="${ouvert}" aria-controls="c-${cle}">
            ${ouvert ? "Masquer" : "Afficher la correction"}
          </button>
        </div>
        <div class="correction" id="c-${cle}" ${ouvert ? "" : "hidden"}>
          ${corpsCorrection(q)}
        </div>
      </article>`;
    }).join("")}`;

  travail.querySelectorAll(".devoiler").forEach(b =>
    b.addEventListener("click", () => basculer(b)));
  document.getElementById("tout").addEventListener("click", toutAfficher);
  majPastilles();
  if (deplacerFocus) {
    history.replaceState(null, "", "#" + ex.id);
    travail.querySelector("h2").scrollIntoView({ block: "nearest" });
  }
}

function basculer(bouton) {
  const cle = bouton.dataset.cle;
  const zone = document.getElementById("c-" + cle);
  const ouvrir = zone.hidden;
  zone.hidden = !ouvrir;
  bouton.setAttribute("aria-expanded", String(ouvrir));
  bouton.textContent = ouvrir ? "Masquer" : "Afficher la correction";
  if (ouvrir) vus.add(cle); else vus.delete(cle);
  memoriser();
  majPastilles();
}

function toutAfficher() {
  const boutons = [...travail.querySelectorAll(".devoiler")];
  const toutOuvert = boutons.every(b => b.getAttribute("aria-expanded") === "true");
  boutons.forEach(b => {
    if ((b.getAttribute("aria-expanded") === "true") === toutOuvert) basculer(b);
  });
  document.getElementById("tout").textContent = toutOuvert ? "Tout afficher" : "Tout masquer";
}

function majPastilles() {
  rail.querySelectorAll(".onglet").forEach(b => {
    const ex = tousExercices.find(e => e.id === b.dataset.cible);
    b.classList.toggle("vu", exerciceVu(ex));
  });
  const bouton = document.getElementById("tout");
  if (bouton && courant) {
    const boutons = [...travail.querySelectorAll(".devoiler")];
    bouton.textContent = boutons.every(b => b.getAttribute("aria-expanded") === "true")
      ? "Tout masquer" : "Tout afficher";
  }
}

construireRail();
const ancre = (location.hash || "").replace("#", "");
afficher(tousExercices.some(e => e.id === ancre) ? ancre : tousExercices[0].id, false);
</script>
